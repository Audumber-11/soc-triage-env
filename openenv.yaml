name: soc-triage-env
version: 1.0.0
description: Security Operations Center (SOC) Alert Triage Environment for training AI agents on security alert classification, incident correlation, and APT campaign detection.

client:
  class_name: SOCTriageClient
  module: client

action:
  class_name: TriageAction
  module: models

observation:
  class_name: TriageObservation
  module: models

default_image: soc-triage-env:latest
spec_version: "1.0"

# Hackathon task definitions
tasks:
  easy:
    name: "Basic Alert Classification"
    description: "Classify 20 security alerts as false_positive/low/medium/high"
    max_steps: 25
    target_score: 0.85
    num_alerts: 20
    false_positive_rate: 0.4

  medium:
    name: "Multi-Source Incident Correlation"
    description: "Correlate 50 alerts from multiple sources into incidents"
    max_steps: 60
    target_score: 0.75
    num_alerts: 50
    false_positive_rate: 0.5
    noise_level: 0.3

  hard:
    name: "APT Campaign Detection"
    description: "Detect APT campaigns in 200 noisy alerts over 30 days"
    max_steps: 150
    target_score: 0.65
    num_alerts: 200
    false_positive_rate: 0.7
    noise_level: 0.5
    time_span_days: 30

# HF Spaces configuration (uses port 7860)
app_port: 7860
app_file: server/app.py

# OpenEnv metadata
author: "Audumber Bhujang"
license: "MIT"
tags:
  - security
  - soc
  - alert-triage
  - incident-response
  - openenv
